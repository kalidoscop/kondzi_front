<div class="flex justify-between items-center p-4">
    <h1 class="text-3xl">Publicité</h1>
    <a
      class="text-ps-green font-bold w-1/5 text-center"
      routerLink="/dashboard/pub/"
      ><i-feather name="corner-up-left" class="h-full"></i-feather
    ></a>
  </div>
  <form
    class="w-11/12 h-auto m-auto p-4 flex flex-col justify-start items-center"
    (ngSubmit)="onSubmit()"
    [formGroup]="pubForm"
  >
    <div class="w-11/12 flex flex-col gap-2 justify-start items-start p-4">
      <input #Image type="file" (change)="handleFileInput($event)" />
      <div class="w-full h-[300px] border-[1px] border-ps-green flex justify-center items-center overflow-hidden">
  
        <img *ngIf="imageUrl" [src]="imageUrl" class="min-h-full min-w-full"/>
      </div>
    </div>
    <div class="row">
      <div class="flex flex-col w-[48%]">
        <label for="last-name">Nom de la publicité</label>
        <input
          type="text"
          id="last-name"
          formControlName="name"
          class="input"
          required
        />
      </div>
      <div class="flex flex-col w-[48%]">
        <label for="first-name">Description de la publicité</label>
        <input
          type="text"
          id="first-name"
          formControlName="description"
          class="input"
          required
        />
      </div>
    </div>
    <!-- adresse -->
    <div class="row mb-5 mt-10">
      <input
        type="button"
        class="w-2/5 h-[5vh] flex justify-center items-center bg-white border border-gray-500 hover:shadow-lg transition-all font-bold text-2xl text-gray-600 text-center"
        value="Annuler"
        routerLink="/dashboard/doctors/"
      />
      <button
        type="submit"
        class="w-1/5 h-[5vh] bg-ps-green font-bold text-2xl text-white text-center hover:shadow-md transition-all hover:shadow-ps-green hover:[text-shadow:_#FFF_1px_0_100px]"
        [disabled]="!pubForm.valid"
      >
        Enregistrer
      </button>
    </div>
  </form>
