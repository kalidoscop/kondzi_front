<div class="flex justify-between items-center p-4">
  <h1 class="text-3xl">Structure</h1>
  <a class="text-ps-green font-bold w-1/5 text-center" routerLink="/dashboard/stuctures/"
    ><i-feather
      name="corner-up-left"
      class="h-full"
    ></i-feather
  ></a>
</div>
<form
  class="w-11/12 h-auto m-auto p-4 flex flex-col justify-start items-center"
  (ngSubmit)="onSubmit()"
  [formGroup]="structureForm"
>
  <div class="row">
    <div class="flex flex-col w-[48%]">
      <label for="name">Nom de la structure</label>
      <input
        type="text"
        id="name"
        formControlName="name"
        class="input"
        required
      />
    </div>
    <div class="flex flex-col w-[48%]">
      <label for="damaine">Domaine de la structure</label>
      <input
        type="text"
        id="damaine"
        formControlName="domaine"
        class="input"
        required
      />
    </div>
  </div>
  <div class="row">
    <div class="flex flex-col w-[48%]">
      <label for="type">Type de structure</label>
      <select
        type="text"
        id="type"
        formControlName="type"
        class="input"
        required
      >
        <option value="ch">Centre hospitalier</option>
        <option value="ch">Pharmacie</option>
      </select>
    </div>
  </div>
  <div class="row">
    <div class="flex flex-col w-[48%]">
      <label for="manager-name">Nom du responsable</label>
      <input
        type="text"
        id="manager-name"
        formControlName="managerName"
        class="input"
        required
      />
    </div>
    <div class="flex flex-col w-[48%]">
      <label for="manager-title">Titre du responsable</label>
      <input
        type="text"
        id="manager-title"
        formControlName="managerTitle"
        class="input"
        required
      />
    </div>
  </div>
  <div class="row">
    <div class="flex flex-col w-[48%]">
      <label for="tel">Numero téléphone de la structure</label>
      <input
        type="text"
        id="tel"
        formControlName="tel"
        class="input"
        required
      />
    </div>
    <div class="flex flex-col w-[48%]">
      <label for="email">Email de la structure</label>
      <input
        type="email"
        id="email"
        formControlName="email"
        class="input"
        required
      />
    </div>
  </div>
  <div class="row">
    <div class="flex flex-col w-11/12">
      <label for="openingHours">Horaire d'ouverture</label>
      <textarea
        class="w-full border p-2 border-ps-green focus:border-ps-orange focus:outline-none focus:border-2"
        formControlName="openingHours"
        id="openingHours"
        required
      ></textarea>
    </div>
  </div>
  <div class="row">
    <div class="flex flex-col w-11/12">
      <label for="activity">activité de la structure</label>
      <textarea
        class="w-full border p-2 border-ps-green focus:border-ps-orange focus:outline-none focus:border-2"
        formControlName="activity"
        id="activity"
        required
      ></textarea>
    </div>
  </div>
  <div class="row">
    <div class="w-[48%]">
      <div class="w-[48%]"></div>
      <h1>Adresses</h1>
    </div>
    <div class="w-[48%]">
      <h1>Reseaux sociaux</h1>
    </div>
  </div>
  <!-- adresse -->
  <div class="row-f">
    <!-- adresse -->
    <table class="w-[48%]">
      <thead class="w-full h-14 bg-ps-green text-white">
        <tr>
          <th>Adresse</th>
          <th>Coordonnée GPS</th>
          <th></th>
        </tr>
      </thead>
      <tbody class="text-center h-10" formArrayName="adresse">
        <tr
          class="h-14"
          *ngFor="
            let item of structureForm.controls.adresse.controls;
            let i = index
          "
          [formGroupName]="i"
        >
          <td>
            <input
              type="text"
              id="nadrees"
              formControlName="nadress"
              class="w-11/12 h-10 px-2 py-2 text-gray-500 focus:outline-none focus:border-2 focus:border-ps-orange border border-ps-green"
            />
          </td>
          <td>
            <input
              type="text"
              class="w-11/12 h-10 px-2 py-2 text-gray-500 focus:outline-none focus:border-2 focus:border-ps-orange border border-ps-green"
              formControlName="eadress"
              id="eadrees"
            />
          </td>
          <td>
            <a (click)="removeAdresse(i)">
              <i-feather
                name="x"
                class="text-red-500 transition-all"
              ></i-feather>
            </a>
          </td>
        </tr>
        <!-- adresse form -->
        <tr [formGroup]="addresseGroup" class="h-14">
          <td>
            <input
              type="text"
              id="nadrees"
              formControlName="nadress"
              class="w-11/12 h-10 px-2 py-2 text-gray-500 focus:outline-none focus:border-2 focus:border-ps-orange border border-ps-green"
              required
            />
          </td>
          <td>
            <input
              type="text"
              class="w-11/12 h-10 px-2 py-2 text-gray-500 focus:outline-none focus:border-2 focus:border-ps-orange border border-ps-green"
              formControlName="eadress"
              id="eadrees"
              required
            />
          </td>
        </tr>
      </tbody>
      <tfoot>
        <div class="w-full">
          <input
            type="button"
            class="bg-ps-green text-white font-bold text-center w-1/2 hover:shadow-md hover:shadow-ps-green hover:[text-shadow:_#FFF_1px_0_50px] transition-all h-[4vh] m-1"
            (click)="addAdresse()"
            [disabled]="!addresseGroup.valid"
            value="Ajouter"
          />
        </div>
      </tfoot>
    </table>
    <!--end adresse -->
    <!-- netwok -->
    <table class="w-[48%]">
      <thead class="w-full h-14 bg-ps-green text-white">
        <tr>
          <th>Nom</th>
          <th>Lien</th>
          <th></th>
        </tr>
      </thead>
      <tbody class="text-center h-10" formArrayName="network">
        <tr
          class="h-14"
          *ngFor="
            let item of structureForm.controls.network.controls;
            let i = index
          "
          [formGroupName]="i"
        >
          <td>
            <input
              type="text"
              id="name"
              formControlName="name"
              class="w-11/12 h-10 px-2 py-2 text-gray-500 focus:outline-none focus:border-2 focus:border-ps-orange border border-ps-green"
            />
          </td>
          <td>
            <input
              type="text"
              id="link"
              formControlName="link"
              class="w-11/12 h-10 px-2 py-2 text-gray-500 focus:outline-none focus:border-2 focus:border-ps-orange border border-ps-green"
            />
          </td>
          <td>
            <a (click)="removeNetwork(i)">
              <i-feather
                name="x"
                class="text-red-500 transition-all"
              ></i-feather>
            </a>
          </td>
        </tr>
        <!-- network form -->
        <tr [formGroup]="networkGroup" class="h-14">
          <td>
            <input
              type="text"
              formControlName="name"
              class="w-11/12 h-10 px-2 py-2 text-gray-500 focus:outline-none focus:border-2 focus:border-ps-orange border border-ps-green"
              required
            />
          </td>
          <td>
            <input
              type="text"
              class="w-11/12 h-10 px-2 py-2 text-gray-500 focus:outline-none focus:border-2 focus:border-ps-orange border border-ps-green"
              formControlName="link"
              required
            />
          </td>
        </tr>
      </tbody>
      <tfoot>
        <div class="w-full">
          <input
            type="button"
            class="bg-ps-green text-white text-center font-bold hover:shadow-md hover:shadow-ps-green hover:[text-shadow:_#FFF_1px_0_50px] transition-all w-1/2 h-[4vh] m-1"
            (click)="addNetwork()"
            [disabled]="!networkGroup.valid"
            value="Ajouter"
          />
        </div>
      </tfoot>
    </table>
    <!--end netwok -->
  </div>
  <div class="row mb-5 mt-10">
    <input type="button"
      class="w-2/5 h-[5vh] flex justify-center items-center bg-white border border-gray-500 hover:shadow-lg transition-all font-bold text-2xl text-gray-600 text-center"
      value="Annuler" routerLink="/dashboard/stuctures/"
    >
    <button
      type="submit"
      class="w-1/5 h-[5vh] bg-ps-green font-bold text-2xl text-white text-center hover:shadow-md transition-all hover:shadow-ps-green hover:[text-shadow:_#FFF_1px_0_100px]"
      [disabled]="!structureForm.valid"
    >
      Enreigistre
    </button>
  </div>
</form>
