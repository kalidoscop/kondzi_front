<div class="flex justify-between items-center p-4">
  <h1 class="text-3xl">Structure</h1>
  <a class="flex gap-1 text-ps-green hover:text-blue-600 transition-all" routerLink="/dashboard/stuctures/add"
    ><i-feather name="plus-circle"></i-feather
  > AJOUTER UNE STRUCTURE</a>
</div>

<table class="table-auto w-[98%] m-auto">
  <thead class="w-full h-14 bg-ps-green text-left text-white">
    <tr>
      <th class="pl-2">NOM</th>
      <th class="pl-2">Domaine d'activité</th>
      <th class="pl-2">Nom du responsable</th>
      <th class="pl-2">Email</th>
      <th class="pl-2">Téléphone</th>
      <th class="pl-2">ACTION</th>
    </tr>
  </thead>
  <tbody>
    @for (data of structure; track $index) {
    <tr class="border-2 h-14">
      <td class="pl-2">{{ data.name }}td></td>
      <td class="pl-2">{{ data.domaine }}</td>
      <td class="pl-2">{{ data.manager_name }}</td>
      <td class="pl-2">{{ data.email }}</td>
      <td class="pl-2">{{ data.tel }}</td>
      <td class="pl-2">
        <a routerLink="/dashboard/stuctures/details"
          ><i-feather
            name="edit"
            class="hover:text-ps-orange transition-all"
          ></i-feather
        ></a>
      </td>
    </tr>
    }
  </tbody>
</table>
