<div class="flex justify-between items-center p-4">
    <h1 class="text-3xl">Article</h1>
    <a
      class="text-ps-green font-bold w-1/5 text-center"
      routerLink="/dashboard/article/"
      ><i-feather name="corner-up-left" class="h-full"></i-feather
    ></a>
  </div>
  <form
    class="w-11/12 h-auto m-auto p-4 flex flex-col justify-start items-center"
    (ngSubmit)="onSubmit()"
    [formGroup]="articleForm"
  >
    <div class="row">
      <div class="flex flex-col w-[48%]">
        <label for="last-name">Titre del'article</label>
        <input
          type="text"
          id="last-name"
          formControlName="title"
          class="input"
          required
        />
      </div>
      <div class="flex flex-col w-[48%]">
        <label for="first-name">Auteur de l'article</label>
        <input
          type="text"
          id="first-name"
          formControlName="autor"
          class="input"
          required
        />
      </div>
    </div>
    <div class="main-container">
      <div
        class="prose editor-container editor-container_classic-editor"
        #editorContainerElement
      >
        <div class="editor-container__editor">
          <div #editorElement>
            <label for="first-name">Contenu de l'article</label>
  
            <ckeditor
              [editor]="Editor"
              [config]="config"
              formControlName="content"
              *ngIf="isLayoutReady"
            />
          </div>
        </div>
      </div>
    </div>
    <!-- adresse -->
    <div class="row mb-5 mt-10">
      <input
        type="button"
        class="w-2/5 h-[5vh] flex justify-center items-center bg-white border border-gray-500 hover:shadow-lg transition-all font-bold text-2xl text-gray-600 text-center"
        value="Annuler"
        routerLink="/dashboard/doctors/"
      />
      <button
        type="submit"
        class="w-1/5 h-[5vh] bg-ps-green font-bold text-2xl text-white text-center hover:shadow-md transition-all hover:shadow-ps-green hover:[text-shadow:_#FFF_1px_0_100px]"
        [disabled]="!articleForm.valid"
      >
        Enregistrer
      </button>
    </div>
  </form>
