<div class="w-full h-full md:flex flex-row justify-center items-center">
  <!-- left -->
  <div class="md:h-full md:w-1/2 flex justify-center items-center bg-ps-green">
    <div class="h-1/4 w-11/12 hidden md:flex justify-center items-center">
      <h1 class="text-4xl text-center font-bold text-white">
        BIENVENUE SUR VOTRE ESPACE KONDZI.COM
      </h1>
    </div>
  </div>
  <!-- left -->
  <!-- right -->
  <div
    class="h-full w-full md:w-1/2 flex flex-col justify-center items-center bg-white"
  >
    <!-- <div class=" bg-red-400"></div> -->
    <div class="h-1/6 w-11/12 flex justify-center items-center">
      <img class="w-96 h-auto" src="images/logo condji-04.png" alt="" />
      <p class="absolute top-1/3 text-sm sm:text-base text-center">Plateforme réseau N°1 d'acteurs professionnels de santé au Togo</p>
    </div>
    <div class="h-2/5 w-11/12 p-2 flex flex-col justify-center items-center">
      <header class="w-11/12 sm:w-96">
        <h1 class="text-xl font-bold text-gray-800">SE CONNECTER</h1>
      </header>
      <!-- FORM -->
      <form
        [formGroup]="loginForm"
        (ngSubmit)="login()"
        class="w-11/12 sm:w-96 flex flex-col justify-start items-center"
      >
        <p></p>
        <div class="mt-4 mb-4 w-full">
          <label for="email" class="block text-gray-600 mb-1"
            >Email de l'utilisateur</label
          >
          <input
            type="email"
            id="email"
            formControlName="email"
            placeholder="Votre adresse electronique"
            class="input"
            required
          />
        </div>
        <div class="mt-4 mb-4 w-full">
          <label for="password" class="block text-gray-600 mb-1"
            >Mot de passe</label
          >
          <input
            type="password"
            id="password"
            formControlName="password"
            placeholder="Votre mot de passe"
            class="input"
            required
          />
        </div>
        <button
          type="submit"
          [disabled]="!loginForm.valid"
          class="transition mt-4 border rounded-full border-ps-green text-ps-green w-1/2 px-4 py-4 hover:bg-ps-green hover:text-white"
        >
          CONNEXION
        </button>
      </form>
    </div>
    <!-- <div class="h-1/6 w-11/12"></div> -->
  </div>
  <!-- right -->
</div>
