<div class="w-full h-full">
  <div class="w-full h-[300px] mt-[5%] flex justify-center items-center">
    <div class="w-11/12 h-full flex justify-center items-center overflow-hidden">
      <img
        *ngIf="baseUrl + image"
        [src]="baseUrl + image"
        class="min-h-full min-w-full"
      />
    </div>
  </div>
  <div class="w-full min-h-40 mt-[30%] md:mt-[5%] flex justify-center">
    <div class="prose w-11/12 text-xl" [innerHTML]="content"></div>
  </div>
  <app-footer></app-footer>
</div>
