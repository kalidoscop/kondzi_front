<div class="w-full h-full m-auto overflow-x-hidden bg-black">
  @if (!simple) {
    <form
    class="w-full fixed top-44 z-20 justify-center flex flex-col lg:hidden items-center"
    (ngSubmit)="onSubmit()"
    [formGroup]="search"
  >
    <label class="font-normal text-xl text-white text-center">QUE SOUHAITEZ-VOUS RECHERCHER ?</label>
    <div class="w-full h-20 flex justify-center items-center gap-2">
      <div class="w-8/12  h-[45px] md:h-[50px]">
        <input
          class="w-full h-full mb-2 p-4 outline-none text-gray-600 bg-gray-200 rounded-full italic text-sm"
          type="text"
          formControlName="word"
          (input)="onSearchChange()"
          placeholder="Médecin, une Adresse, un Spécialiste, un thème...."
        />

        @if (suggestion.length) {
        <!-- <span class="bg-green-500 absolute w-screen h-screen  top-0 left-0" (click)="closeSuggestion()"></span> -->
        <div
          class="bg-white w-8/12 rounded-2xl absolute max-h-96 overflow-y-auto z-30 sugg"
        >
          <span
            class="fixed w-screen h-screen -z-20 top-0 left-0"
            (click)="closeSuggestion()"
          ></span>
          <ul class="w-full flex flex-col justify-start items-center">
            <!-- @if (otherSuggestions.length) { 
                @for (item of otherSuggestions;
              track $index) {
              <li
                (click)="onActivityClick(item.domaine)"
                class="w-full min-h-10 border-b-2 flex justify-center items-center border-gray-500"
              >
                <button type="button" class="w-full h-full  text-start pl-4">
                  {{ item.domaine }}
                </button>
              </li>
    
              } 
              }  -->
            @for (item of suggestion; track $index) {
            <li
              (click)="onActivityClick(item)"
              class="w-11/12 hover:bg-gray-200 min-h-10 border-b-[0.2px] flex justify-center items-center border-gray-300"
            >
              <button
                type="button"
                class="w-full flex font-bold text-gray-500 justify-start gap-3 items-center h-full text-start"
              >
                <i-feather
                  name="search"
                  class="text-gray-500 font-bold w-full h-full text-center transition-all"
                ></i-feather>
                {{ item }}
              </button>
            </li>
            }
          </ul>
        </div>
        }
      </div>
      <button
        type="submit"
        [disabled]="!search.valid"
        class="w-[45px] h-[45px] md:h-[50px] rounded-full bg-ps-green flex justify-center items-center font-bold"
      >
        <i-feather name="search" class="text-white transition-all"></i-feather>
      </button>
    </div>
    <p class="text-xs md:text-lg text-gray-100 italic">
      (saisir les 3 premières lettres de votre recherche)
    </p>
  </form>
  }

  @for (item of images; track $index) {
  <div class="absolute h-full w-full flex flex-col justify-end lg:justify-center items-center">
    <h1
      class="text-[5vw] lg:text-[2.5vw] mb-20 lg:mb-0 text-center w-full h-1/6 z-10 text-white font-bold"
      [ngClass]="{ 'img-active': selectedIndex === $index }"
    >
      {{ item.text }}
    </h1>
  </div>
  <div
    class="img h-full w-full"
    style="background-image: url('{{
      item.imageSrc
    }}'); background-size: cover; background-repeat: no-repeat; background-position: center;"
    [ngClass]="{ 'img-active': selectedIndex === $index }"
  ></div>
  }

  <!-- <img src="images/logo condji-02.png" alt=""> -->
</div>
