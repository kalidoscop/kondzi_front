<ul class="w-1/6 h-full fixed pt-40 left-0 menu md:menu-md lg:menu-lg bg-base-200 rounded-box">
  @for (data of navData; track $index) {
  <li
    *ngIf="data.open"
    
  >
    <a routerLinkActive="menu-active"
    [routerLinkActiveOptions]="{ exact: true }"  [routerLink]="data.link"
      ><samp>{{ data.label }}</samp></a
    >
  </li>

  }
</ul>
